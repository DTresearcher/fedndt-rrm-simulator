simulation:
  random_seed: 46
  time_steps: 120

network:
  num_edge_nodes: 3
  num_users: 75
  total_resource_units: 90.0
  base_latency_ms: 10.0
  sla_latency_threshold_ms: 50.0

traffic:
  profile: "low_capacity_edge_stress"
  base_demand: 1.0
  peak_multiplier: 2.8
  noise_std: 0.30

radio:
  base_quality: 20.0
  distance_loss_factor: 0.08
  interference_mean: 2.4
  interference_std: 0.9
  quality_noise_std: 1.1

federated:
  rounds_per_step: 1
  history_window: 8
  prediction_smoothing: 0.55

incentive:
  enabled: true
  freshness_weight: 0.25
  accuracy_weight: 0.35
  consistency_weight: 0.30
  fairness_weight: 0.10

stress:
  enabled: true
  overloaded_edge_node_id: 1
  overload_start_step: 45
  overload_end_step: 85
  overload_multiplier: 2.7
  mobility_shift_probability: 0.25

  unreliable_edge_node_id: 2
  stale_update_probability: 0.22
  report_noise_probability: 0.35
  report_noise_std: 0.50

  greedy_observation_delay_steps: 5
