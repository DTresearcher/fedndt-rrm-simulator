[project]
name = "fndt-simulator"
version = "2.0.0"
description = "Network-level simulator and statistical evaluation for the Federated Network Digital Twin (FNDT) framework"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.2.6",
    "scipy==1.15.3",
    "pandas==2.2.3",
    "matplotlib==3.10.3",
    "pyyaml==6.0.2",
    "tabulate==0.9.0",
]

[project.optional-dependencies]
test = ["pytest==8.3.5"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["fndt*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
